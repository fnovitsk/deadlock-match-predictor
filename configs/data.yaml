# Data scope. Filter values confirmed against the dumps; dates are set in Milestone 1 findings.
source:
  manifest_url: https://data.deadlock-api.com/v1/manifest.json
  table: match_player

filters:
  match_mode: Ranked
  game_mode: Normal      # 6v6; the other main mode is StreetBrawl
  start_date: null       # set to the latest major patch date
  end_date: null

# Small local sample for exploration (Milestone 1).
sample:
  n_matches: 5000
  min_partition: 118     # partition = match_id // 1_000_000 (higher = newer)
  max_partition: 120
  seed: 0
  path: data/interim/sample_ranked.parquet

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
