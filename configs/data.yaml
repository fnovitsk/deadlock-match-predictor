# Data scope. Values confirmed in notebooks/01_explore_data.ipynb.
source:
  manifest_url: https://data.deadlock-api.com/v1/manifest.json
  table: match_player

filters:
  match_mode: Ranked
  game_mode: Normal      # 6v6; the other main mode is StreetBrawl
  # Last major patch (api.deadlock-api.com/v1/patches/big-days); game_mode_version is constant.
  start_time: "2026-09-29T20:25:11Z"
  end_time: null

# Small local sample for exploration (Milestone 1).
sample:
  n_matches: 5000
  min_partition: 118     # partition = match_id // 1_000_000 (higher = newer)
  max_partition: 120
  seed: 0
  path: data/interim/sample_ranked.parquet

# Full pipeline (Milestone 2): python -m deadlock_predictor.data.pipeline
pipeline:
  raw_dir: data/raw/match_player          # one Parquet file per partition
  snapshots_path: data/processed/snapshots.parquet
  summary_path: data/processed/summary.json   # filter counts and split boundaries
  refresh_latest: 2      # newest partitions still fill up: always re-download them
  split:
    train: 0.70          # oldest 70% of matches
    validation: 0.15     # next 15%; the newest 15% are test

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
