# Model settings. Test split stays sealed until the end of Milestone 4.
baseline:
  rungs: [1, 2, 3, 4]          # see deadlock_predictor.models.baseline.RUNGS
  C_grid: [0.01, 0.1, 1, 10, 100]   # inverse L2 strength, tuned on validation
  tolerance: 0.0005   # keep the simplest rung within this log loss of the best
  model_path: models/baseline.joblib
  metrics_path: models/baseline_metrics.json
baseline_heroes:              # the same ladder with hero picks (Milestone 4)
  rungs: [5, 6]
  C_grid: [0.01, 0.1, 1, 10, 100]
  tolerance: 0.0005
  model_path: models/baseline_heroes.joblib
  metrics_path: models/baseline_heroes_metrics.json

# LightGBM (Milestone 4): python -m deadlock_predictor.models.train_gbm
gbm:
  heroes: false
  learning_rate: 0.05
  n_estimators: 3000           # upper bound; early stopping on validation picks the count
  early_stopping_rounds: 100
  n_jobs: 8                    # half the threads: full load crashed the PC once
  grid:
    num_leaves: [31, 127]      # leaves per tree: how complex one tree can be
    min_child_samples: [200, 2000]   # rows a leaf needs: guards against fitting noise
  model_path: models/gbm.joblib
  metrics_path: models/gbm_metrics.json
gbm_heroes:
  heroes: true
  learning_rate: 0.05
  n_estimators: 3000
  early_stopping_rounds: 100
  n_jobs: 8
  grid:
    num_leaves: [31, 127]
    min_child_samples: [200, 2000]
  model_path: models/gbm_heroes.joblib
  metrics_path: models/gbm_heroes_metrics.json
gbm_live:                     # Milestone 6: only what live games show (models.gbm.LIVE_COLUMNS)
  heroes: true
  live: true
  learning_rate: 0.05
  n_estimators: 3000
  early_stopping_rounds: 100
  n_jobs: 8
  grid:
    num_leaves: [31, 127]
    min_child_samples: [200, 2000]
  model_path: models/gbm_live.joblib
  metrics_path: models/gbm_live_metrics.json

# The final pick among the four cells, simplest first.
final:
  cells: [baseline, baseline_heroes, gbm, gbm_heroes]
  tolerance: 0.0005
  path: models/final.json

# One-time test evaluation (end of Milestone 4): python -m deadlock_predictor.models.evaluate_test
test:
  path: models/test_metrics.json

# Deploy refit (refit --all): the test cells plus these.
deploy:
  cells: [gbm_live]
